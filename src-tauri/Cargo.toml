[package]
name = "lanx"
version = "3.7.0"
description = "LANX Desktop - Local Network Messenger"
authors = ["LANX Team"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lanx_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# LANX 2.5.0: speech to text on this PC (whisper.cpp). Needs cmake + a C++ compiler to build.
whisper-rs = "0.14"
dirs = "6.0"
parking_lot = "0.12"
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
hex = "0.4"
socket2 = "0.6"
if-addrs = "0.13"
argon2 = "0.5"
base64 = "0.22"
# LANX 3.0: the phone page's web server (HTTP head parsing, WebSocket handshake) and the QR code in Settings.
httparse = "1"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.13", default-features = false }
# LANX 3.2: the phone page over HTTPS. The PC makes its own certificate authority and server
# certificate (rcgen) and serves TLS with rustls; `ring` is the crypto that builds on this PC
# without extra tools (it ships precompiled Windows objects, aws-lc needs NASM/CMake).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.10", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
time = "0.3"
# LANX 3.2: alerts pushed to a phone whose LANX page is closed (web push, see phone/push.rs).
# The message is encrypted for the phone (P-256 ECDH + HKDF + AES-128-GCM, RFC 8291) and the
# request signed (VAPID, ES256) — all pure Rust; the `web-push` crate needs OpenSSL and does
# not build here. The push service's certificate is checked against the public roots.
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "ecdh", "std"] }
aes-gcm = "0.10"
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
# LANX 1.2.7: move the desktop island to the virtual desktop in use (COM).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp"] }
# LANX 1.9.1: notice when WebView2 stops (see window_doctor.rs); the same version Tauri uses.
webview2-com = "0.39"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
