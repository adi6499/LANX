<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/tauri.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LANX — Local Network Messenger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
      (function() {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 dark:bg-[#080c14] dark:text-slate-100 antialiased select-none overflow-hidden">
    <div id="root" class="h-screen w-screen overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
