<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lanx-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LANX — Local Network Messenger</title>
    <!-- Applies dark mode before first paint (external file so the strict CSP allows it). -->
    <script src="/theme-init.js"></script>
    <!-- LANX 2.5.3: the page has its colour and a logo from the very first paint,
         so the window is never white while the app's code loads. -->
    <style>
      html { background: #f8fafc; }
      html.dark { background: #080c14; }
      #lanx-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: system-ui, "Segoe UI", sans-serif; color: #64748b; }
      #lanx-splash img { width: 72px; height: 72px; border-radius: 18px; animation: lanx-splash-pulse 1.4s ease-in-out infinite; }
      #lanx-splash b { font-size: 13px; letter-spacing: 0.25em; }
      @keyframes lanx-splash-pulse { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#080c14] dark:text-slate-100 antialiased select-none overflow-hidden">
    <div id="lanx-splash"><img src="/lanx-logo.png" alt="" /><b>LANX</b></div>
    <div id="root" class="h-screen w-screen overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
